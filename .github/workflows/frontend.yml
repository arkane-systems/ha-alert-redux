name: Frontend

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: "actions/checkout@v4"

      - name: Set up Node
        uses: "actions/setup-node@v4"
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check committed bundle is up to date
        run: git diff --exit-code -- ../custom_components/alert_redux/frontend/
