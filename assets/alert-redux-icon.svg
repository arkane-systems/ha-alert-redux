<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Alert Redux icon (master). Priority bands, top to bottom:
       Emergency #E53935, Critical #FB8C00, Warning #FDD835, Notice #43A047,
       Informational #1E88E5. -->
  <defs>
    <clipPath id="tri"><path d="M128 22 L240 222 L16 222 Z"/></clipPath>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="#26305A"/>
  <g transform="translate(128 128) scale(0.86) translate(-128 -128)">
    <path d="M 30.3 169.6 A 104 104 0 1 1 225.7 169.6" fill="none" stroke="#fff"
          stroke-width="14" stroke-linecap="round"/>
    <path d="M 241 168.8 L 219.5 190 L 212.6 158.2 Z" fill="#fff"/>
    <g transform="translate(128 150) scale(0.7) translate(-128 -150)">
      <g clip-path="url(#tri)">
        <rect x="0" y="22" width="256" height="40" fill="#E53935"/>
        <rect x="0" y="62" width="256" height="40" fill="#FB8C00"/>
        <rect x="0" y="102" width="256" height="40" fill="#FDD835"/>
        <rect x="0" y="142" width="256" height="40" fill="#43A047"/>
        <rect x="0" y="182" width="256" height="40" fill="#1E88E5"/>
      </g>
      <rect x="115" y="82" width="26" height="88" rx="13" fill="#fff" stroke="#26305A" stroke-width="7"/>
      <circle cx="128" cy="195" r="15" fill="#fff" stroke="#26305A" stroke-width="7"/>
    </g>
  </g>
</svg>
